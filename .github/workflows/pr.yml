# LetisPOS — Pull Request Validation
# =====================================
# Lightweight, fast feedback on PRs. Only builds changed services.
# No image push, no deployment.

name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  #  Detect changed paths
  # ──────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      services: ${{ steps.services.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

      - name: Compute changed services
        id: services
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            // Find which service directories changed relative to the base branch
            const base = '${{ github.event.pull_request.base.sha }}';
            const head = '${{ github.event.pull_request.head.sha }}';
            try {
              const diff = execSync(`git diff --name-only ${base}..${head}`, { encoding: 'utf8' });
              const services = new Set();

              // Always include if parent POM changes (affects all)
              if (diff.includes('backend/pom.xml')) {
                return 'all';
              }

              const serviceMap = [
                { path: 'backend/gateway/',             name: 'gateway' },
                { path: 'backend/auth-service/',        name: 'auth-service' },
                { path: 'backend/user-service/',        name: 'user-service' },
                { path: 'backend/product-service/',     name: 'product-service' },
                { path: 'backend/inventory-service/',   name: 'inventory-service' },
                { path: 'backend/sales-service/',       name: 'sales-service' },
                { path: 'backend/payment-service/',     name: 'payment-service' },
                { path: 'backend/report-service/',      name: 'report-service' },
                { path: 'backend/notification-service/', name: 'notification-service' },
                { path: 'backend/hrm-service/',         name: 'hrm-service' },
                { path: 'backend/ai-service/',          name: 'ai-service' },
                { path: 'backend/integration-service/', name: 'integration-service' },
                { path: 'backend/libs/',                name: 'libs' },
              ];

              for (const { path, name } of serviceMap) {
                if (diff.includes(path)) services.add(name);
              }

              return JSON.stringify([...services]);
            } catch (e) {
              return 'all';
            }

  # ──────────────────────────────────────────────────────────────────────────
  #  Backend — changed services only
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services == 'all' && '["gateway","auth-service","user-service","product-service","inventory-service","sales-service","payment-service","report-service","notification-service","hrm-service","ai-service","integration-service"]' || needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & test ${{ matrix.service }}
        run: |
          cd backend
          # If it's the libs directory, just build the lib
          if [ "${{ matrix.service }}" = "libs" ]; then
            mvn -B -pl libs/outbox-relay clean package
          else
            mvn -B -pl ${{ matrix.service }} -am clean package -Dstyle.color=always
          fi

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: PR Tests — ${{ matrix.service }}
          path: 'backend/${{ matrix.service }}/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

  # ──────────────────────────────────────────────────────────────────────────
  #  Frontend
  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Lint & Type-check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Type-check
        run: cd frontend && npx tsc --noEmit

      - name: Build
        run: cd frontend && npm run build

  # ──────────────────────────────────────────────────────────────────────────
  #  PR Labeler — auto-label based on changed paths
  # ──────────────────────────────────────────────────────────────────────────
  labeler:
    name: Label PR
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
