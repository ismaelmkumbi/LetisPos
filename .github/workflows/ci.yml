# LetisPOS — Main CI/CD Pipeline
# =================================
# Triggered on push to main. Builds, tests, containerizes all services,
# pushes images to GitHub Container Registry, and deploys to production.
#
# Secrets required (set in Settings → Secrets and variables → Actions):
#   VPS_HOST          — Production server IP/hostname
#   VPS_USER          — SSH user (e.g. deploy)
#   VPS_SSH_KEY       — SSH private key for authentication
#   VPS_PROJECT_PATH  — (optional) project directory on server (default: /var/www/LetisPos)

name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Override image tag (default: git SHA)'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ismaelmkumbi
  JAVA_VERSION: '21'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ────────────────────────────────────────────────────────────────────────
  #  Detect what changed
  # ────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      gateway: ${{ steps.filter.outputs.gateway }}
      auth_service: ${{ steps.filter.outputs.auth_service }}
      user_service: ${{ steps.filter.outputs.user_service }}
      product_service: ${{ steps.filter.outputs.product_service }}
      inventory_service: ${{ steps.filter.outputs.inventory_service }}
      sales_service: ${{ steps.filter.outputs.sales_service }}
      payment_service: ${{ steps.filter.outputs.payment_service }}
      report_service: ${{ steps.filter.outputs.report_service }}
      notification_service: ${{ steps.filter.outputs.notification_service }}
      hrm_service: ${{ steps.filter.outputs.hrm_service }}
      ai_service: ${{ steps.filter.outputs.ai_service }}
      integration_service: ${{ steps.filter.outputs.integration_service }}
      document_service: ${{ steps.filter.outputs.document_service }}
      commerce_service: ${{ steps.filter.outputs.commerce_service }}
      audit_service: ${{ steps.filter.outputs.audit_service }}
      billing_service: ${{ steps.filter.outputs.billing_service }}
      crm_service: ${{ steps.filter.outputs.crm_service }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so paths-filter can diff against github.event.before

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # On workflow_dispatch there is no 'before' SHA; compare against HEAD~1
          base: ${{ github.event_name == 'workflow_dispatch' && 'HEAD~1' || github.event.before }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            gateway:
              - 'backend/gateway/**'
              - 'backend/pom.xml'
            auth_service:
              - 'backend/auth-service/**'
              - 'backend/pom.xml'
            user_service:
              - 'backend/user-service/**'
              - 'backend/pom.xml'
            product_service:
              - 'backend/product-service/**'
              - 'backend/pom.xml'
            inventory_service:
              - 'backend/inventory-service/**'
              - 'backend/pom.xml'
            sales_service:
              - 'backend/sales-service/**'
              - 'backend/pom.xml'
            payment_service:
              - 'backend/payment-service/**'
              - 'backend/pom.xml'
            report_service:
              - 'backend/report-service/**'
              - 'backend/pom.xml'
            notification_service:
              - 'backend/notification-service/**'
              - 'backend/pom.xml'
            hrm_service:
              - 'backend/hrm-service/**'
              - 'backend/pom.xml'
            ai_service:
              - 'backend/ai-service/**'
              - 'backend/pom.xml'
            integration_service:
              - 'backend/integration-service/**'
              - 'backend/pom.xml'
            document_service:
              - 'backend/document-service/**'
              - 'backend/pom.xml'
            commerce_service:
              - backend/commerce-service/**
              - 'backend/pom.xml'
            audit_service:
              - backend/audit-service/**
              - 'backend/pom.xml'
            billing_service:
              - backend/billing-service/**
              - 'backend/pom.xml'
            crm_service:
              - backend/crm-service/**
              - 'backend/pom.xml'

  # ────────────────────────────────────────────────────────────────────────
  #  Build & Test — Backend (matrix across all services)
  # ────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # dorny/test-reporter needs checks:write to post results
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - auth-service
          - user-service
          - product-service
          - inventory-service
          - sales-service
          - payment-service
          - report-service
          - notification-service
          - hrm-service
          - ai-service
          - integration-service
          - document-service
          - commerce-service
          - audit-service
          - billing-service
          - crm-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & test ${{ matrix.service }}
        run: |
          cd backend
          mvn -B -pl ${{ matrix.service }} -am clean package \
            -Dstyle.color=always \
            2>&1 | tee build.log

      - name: Publish test results
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v1
        with:
          name: Tests — ${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.service }}
          path: backend/build.log
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────
  #  Build — Frontend
  # ────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Build & Lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Type-check
        run: cd frontend && npx tsc --noEmit

      - name: Build
        run: cd frontend && npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
