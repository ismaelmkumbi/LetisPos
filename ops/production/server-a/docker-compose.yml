      REDIS_HOST: 10.0.0.3
      REDIS_PORT: '6379'
      SERVER_PORT: '8096'
      SPRING_DATASOURCE_URL: jdbc:postgresql://10.0.0.3:5432/billing_db?preferQueryMode=simple
      SPRING_DATA_REDIS_HOST: 10.0.0.3
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 180s
      test:
      - CMD-SHELL
      - curl -sf http://localhost:8096/actuator/health || exit 1
      timeout: 5s
    image: ghcr.io/ismaelmkumbi/billing-service:latest
