networks:
  server-a-net:
    driver: bridge
services:
  ai-service:
    container_name: letispos-ai
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      AUTH_SERVICE_URL: http://auth-service:8081
      CUSTOMER_SERVICE_URL: http://10.0.0.3:8085
      DB_PASSWORD: ai_pass
      DB_URL: jdbc:postgresql://10.0.0.3:5432/ai_db?preferQueryMode=simple
      DB_USERNAME: ai_user
      DOCUMENT_SERVICE_URL: http://document-service:8093
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      INVENTORY_SERVICE_URL: http://10.0.0.3:8084
      KAFKA_BOOTSTRAP: 10.0.0.3:9094
      KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
      NOTIFICATION_SERVICE_URL: http://notification-service:8089
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-4o-mini}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PAYMENT_SERVICE_URL: http://10.0.0.3:8086
      PRODUCT_SERVICE_URL: http://10.0.0.3:8083
      REDIS_HOST: 10.0.0.3
      REDIS_PORT: '6379'
      SALES_SERVICE_URL: http://10.0.0.3:8085
      SERVER_PORT: '8091'
      SPRING_DATA_REDIS_HOST: 10.0.0.3
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 180s
      test:
      - CMD-SHELL
      - curl -sf http://localhost:8091/actuator/health || exit 1
      timeout: 5s
    image: ghcr.io/ismaelmkumbi/ai-service:latest
    logging: &id001
      driver: json-file
      options:
        max-file: '3'
        max-size: 20m
    networks:
    - server-a-net
    restart: unless-stopped
  audit-service:
    container_name: letispos-audit
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    environment:
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      DB_PASSWORD: audit_pass
      DB_URL: jdbc:postgresql://10.0.0.3:5432/audit_db?preferQueryMode=simple
      DB_USERNAME: audit_user
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      KAFKA_BOOTSTRAP: 10.0.0.3:9094
      KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
      REDIS_HOST: 10.0.0.3
      REDIS_PORT: '6379'
      SERVER_PORT: '8095'
      SPRING_DATASOURCE_URL: jdbc:postgresql://10.0.0.3:5432/audit_db?preferQueryMode=simple
      SPRING_DATA_REDIS_HOST: 10.0.0.3
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 180s
      test:
      - CMD-SHELL
      - curl -sf http://localhost:8095/actuator/health || exit 1
      timeout: 5s
    image: ghcr.io/ismaelmkumbi/audit-service:latest
    logging: *id001
    networks:
    - server-a-net
    restart: unless-stopped
  auth-service:
    container_name: letispos-auth
    deploy:
      resources:
        limits:
          memory: 448M
        reservations:
          memory: 192M
    environment:
      APP_BASE_URL: https://letispos.com
      AUDIT_SERVICE_URL: http://audit-service:8095
      DB_PASSWORD: auth_pass
      DB_URL: jdbc:postgresql://10.0.0.3:5432/auth_db?preferQueryMode=simple
      DB_USERNAME: auth_user
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      JWT_ALLOW_EPHEMERAL_KEYS: 'false'
      JWT_PRIVATE_KEY_PATH: /run/secrets/letispos-jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/letispos-jwt/public.pem
      KAFKA_BOOTSTRAP: 10.0.0.3:9094
      KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
      REDIS_HOST: 10.0.0.3
      REDIS_PORT: '6379'
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SERVER_PORT: '8081'
      SPRING_DATA_REDIS_HOST: 10.0.0.3
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
      USER_SERVICE_URL: http://user-service:8082
    ports:
      - "0.0.0.0:8081:8081"
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 180s
      test:
      - CMD-SHELL
      - curl -sf http://localhost:8081/actuator/health || exit 1
      timeout: 5s
    image: ghcr.io/ismaelmkumbi/auth-service:latest
    logging: *id001
    networks:
    - server-a-net
    restart: unless-stopped
    volumes:
    - /etc/letispos/jwt:/run/secrets/letispos-jwt:ro
