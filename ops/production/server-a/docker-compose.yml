networks:
  server-a-net:
    driver: bridge
services:
  auth-service:
    container_name: letispos-auth
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 192M
    environment:
      APP_BASE_URL: https://letispos.com
      AUDIT_SERVICE_URL: http://10.0.0.2:8095
      DB_PASSWORD: auth_pass
      DB_URL: jdbc:postgresql://10.0.0.3:5432/auth_db      DB_USERNAME: auth_user
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      JWT_ALLOW_EPHEMERAL_KEYS: 'false'
      JWT_PRIVATE_KEY_PATH: /run/secrets/letispos-jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/letispos-jwt/public.pem
      KAFKA_BOOTSTRAP: 10.0.0.3:9094
      KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
      REDIS_HOST: 10.0.0.3
      REDIS_PORT: '6379'
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SERVER_PORT: '8081'
      JAVA_TOOL_OPTIONS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0
        -XX:+UseZGC -XX:ZCollectionInterval=10 -XX:SoftMaxHeapSize=512M -XX:ZUncommitDelay=300
        -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp
      SPRING_DATA_REDIS_HOST: 10.0.0.3
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
      USER_SERVICE_URL: http://user-service:8082
    ports:
    - 0.0.0.0:8081:8081
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 40s
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8081/actuator/health || exit 1
      timeout: 5s
    image: ghcr.io/ismaelmkumbi/auth-service:latest
    logging: &id001
      driver: json-file
      options:
        max-file: '3'
        max-size: 20m
    networks:
    - server-a-net
    restart: unless-stopped
    volumes:
    - /etc/letispos/jwt:/run/secrets/letispos-jwt:ro
  control-hub:
    container_name: letispos-control-hub
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      DB_PASSWORD: control_hub_pass
      DB_URL: jdbc:postgresql://10.0.0.3:5432/control_hub_db      DB_USER: control_hub_user
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      KAFKA_BOOTSTRAP: 10.0.0.3:9094
      KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
      REDIS_HOST: 10.0.0.3
      REDIS_PORT: '6379'
      SERVER_PORT: '8098'
      SPRING_DATA_REDIS_HOST: 10.0.0.3
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
      JAVA_TOOL_OPTIONS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0
        -XX:+UseZGC -XX:ZCollectionInterval=10 -XX:SoftMaxHeapSize=512M -XX:ZUncommitDelay=300
        -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 40s
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8098/actuator/health || exit 1
      timeout: 5s
    image: ghcr.io/ismaelmkumbi/control-hub:latest
    logging: *id001
    networks:
    - server-a-net
    restart: unless-stopped
  frontend:
    container_name: letispos-frontend
    deploy:
      resources:
        limits:
          memory: 64M
    expose:
    - '80'
    healthcheck:
      interval: 15s
      retries: 5
      start_period: 10s
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:80/ || exit 1
      timeout: 5s
    image: ghcr.io/ismaelmkumbi/frontend:latest
    logging: *id001
    networks:
    - server-a-net
    restart: unless-stopped
  gateway:
    container_name: letispos-gateway
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    environment:
      AI_URI: http://10.0.0.2:8091
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      AUTH_URI: http://auth-service:8081
      BILLING_URI: http://10.0.0.2:8096
      DOCUMENT_URI: http://10.0.0.2:8093
      AUDIT_URI: http://10.0.0.2:8095
      COMMERCE_URI: http://10.0.0.3:8094
      CRM_URI: http://10.0.0.2:8097
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      HRM_URI: http://10.0.0.2:8090
      INTEGRATION_URI: http://10.0.0.2:8092
      INVENTORY_URI: http://10.0.0.3:8084
      KAFKA_BOOTSTRAP: 10.0.0.3:9094
      KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
      NOTIFICATION_URI: http://10.0.0.2:8089
      PAYMENT_URI: http://10.0.0.3:8086
      PRODUCT_URI: http://10.0.0.3:8083
      REDIS_HOST: 10.0.0.3
      REDIS_PORT: '6379'
      REPORT_URI: http://10.0.0.2:8087
      SALES_URI: http://10.0.0.3:8085
      SERVER_PORT: '8080'
      JAVA_TOOL_OPTIONS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0
        -XX:+UseZGC -XX:ZCollectionInterval=10 -XX:SoftMaxHeapSize=512M -XX:ZUncommitDelay=300
        -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp
      SPRING_DATA_REDIS_HOST: 10.0.0.3
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
      USER_URI: http://user-service:8082
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 40s
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8080/actuator/health || exit 1
      timeout: 5s
    image: ghcr.io/ismaelmkumbi/gateway:latest
    logging: *id001
    networks:
    - server-a-net
    ports:
    - 0.0.0.0:8080:8080
    restart: unless-stopped
  gateway-backup:
    container_name: letispos-gateway-backup
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    environment:
      AI_URI: http://10.0.0.2:8091
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      AUTH_URI: http://auth-service:8081
      BILLING_URI: http://10.0.0.2:8096
      DOCUMENT_URI: http://10.0.0.2:8093
      AUDIT_URI: http://10.0.0.2:8095
      COMMERCE_URI: http://10.0.0.3:8094
      CRM_URI: http://10.0.0.2:8097
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      HRM_URI: http://10.0.0.2:8090
      INTEGRATION_URI: http://10.0.0.2:8092
      INVENTORY_URI: http://10.0.0.3:8084
      KAFKA_BOOTSTRAP: 10.0.0.3:9094
      KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
      NOTIFICATION_URI: http://10.0.0.2:8089
      PAYMENT_URI: http://10.0.0.3:8086
      PRODUCT_URI: http://10.0.0.3:8083
      REDIS_HOST: 10.0.0.3
      REDIS_PORT: '6379'
      REPORT_URI: http://10.0.0.2:8087
      SALES_URI: http://10.0.0.3:8085
      SERVER_PORT: '8080'
      JAVA_TOOL_OPTIONS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0
        -XX:+UseZGC -XX:ZCollectionInterval=10 -XX:SoftMaxHeapSize=512M -XX:ZUncommitDelay=300
        -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp
      SPRING_DATA_REDIS_HOST: 10.0.0.3
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
      USER_URI: http://user-service:8082
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 40s
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8080/actuator/health || exit 1
      timeout: 5s
    image: ghcr.io/ismaelmkumbi/gateway:latest
    logging: *id001
    networks:
    - server-a-net
    restart: unless-stopped
  minio:
    command: server /data --console-address ":9001"
    container_name: letispos-minio
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      MINIO_ROOT_PASSWORD: smartpos-secret
      MINIO_ROOT_USER: smartpos
    healthcheck:
      interval: 15s
      retries: 5
      start_period: 10s
      test:
      - CMD-SHELL
      - curl -sf http://localhost:9000/minio/health/live || exit 1
      timeout: 5s
    image: minio/minio:latest
    logging: *id001
    networks:
    - server-a-net
    ports:
    - 0.0.0.0:9000:9000
    - 0.0.0.0:9001:9001
    restart: unless-stopped
    volumes:
    - minio-data:/data
  nginx:
    container_name: letispos-nginx
    deploy:
      resources:
        limits:
          memory: 128M
    image: nginx:1.27-alpine
    logging: *id001
    networks:
    - server-a-net
    ports:
    - 0.0.0.0:80:80
    - 0.0.0.0:443:443
    restart: unless-stopped
    volumes:
    - /etc/letispos/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - /etc/letsencrypt:/etc/letsencrypt:ro
  node-exporter:
    command:
    - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|run|docker/.+|var/lib/docker/.+)($|/)
    container_name: letispos-node-exporter
    image: prom/node-exporter:latest
    logging: *id001
    networks:
    - server-a-net
    ports:
    - 0.0.0.0:9100:9100
    restart: unless-stopped
  user-service:
    container_name: letispos-user
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    environment:
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      DB_PASSWORD: user_pass
      DB_URL: jdbc:postgresql://10.0.0.3:5432/user_db      DB_USERNAME: user_user
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      KAFKA_BOOTSTRAP: 10.0.0.3:9094
      KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
      REDIS_HOST: 10.0.0.3
      REDIS_PORT: '6379'
      SERVER_PORT: '8082'
      JAVA_TOOL_OPTIONS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0
        -XX:+UseZGC -XX:ZCollectionInterval=10 -XX:SoftMaxHeapSize=512M -XX:ZUncommitDelay=300
        -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp
      SPRING_DATA_REDIS_HOST: 10.0.0.3
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 40s
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8082/actuator/health || exit 1
      timeout: 5s
    image: ghcr.io/ismaelmkumbi/user-service:latest
    logging: *id001
    networks:
    - server-a-net
    restart: unless-stopped
volumes:
  minio-data: null
x-health-defaults:
  interval: 10s
  retries: 10
  start_period: 180s
  timeout: 5s
x-logging: *id001
