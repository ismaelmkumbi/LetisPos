# Control Center UI — nginx config
# =================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # API proxy to LSA Agent on localhost
    location /api/agent/ {
        proxy_pass http://10.0.0.2:9101/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API proxy to main gateway (auth, users, etc.)
    location /api/ {
        proxy_pass http://10.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host letispos.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Agent selection — proxy to LSA Agents on each server
    location /api/agent/a/ {
        proxy_pass http://10.0.0.1:9101/;
        proxy_http_version 1.1;
    }
    location /api/agent/b/ {
        proxy_pass http://10.0.0.2:9101/;
        proxy_http_version 1.1;
    }
    location /api/agent/c/ {
        proxy_pass http://10.0.0.3:9101/;
        proxy_http_version 1.1;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

