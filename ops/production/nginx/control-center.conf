# Control Center UI — nginx config
# =================================
# Serves the React dashboard and proxies API calls through the main
# gateway (which routes to control-hub → LSA agent).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Proxy ALL API calls to the main gateway on Server A.
    # The gateway routes /api/agent/** → control-hub → LSA agent
    # and /api/v1/** → backend services.
    location /api/ {
        proxy_pass http://10.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host letispos.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
