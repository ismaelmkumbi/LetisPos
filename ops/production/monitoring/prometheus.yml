# LetisPOS — Prometheus configuration (Server B)
# ==============================================
# All inter-server scraping uses private network (10.0.0.0/24).

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: production
    region: eu

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── Node Exporters ─────────────────────────────────────────
  - job_name: node-server-a
    static_configs:
      - targets: ["10.0.0.1:9100"]
        labels: { server: a, hostname: letispos-a }

  - job_name: node-server-b
    static_configs:
      - targets: ["localhost:9100"]
        labels: { server: b, hostname: letispos-b }

  - job_name: node-server-c
    static_configs:
      - targets: ["10.0.0.3:9100"]
        labels: { server: c, hostname: letispos-c }

  # ── Docker metrics ─────────────────────────────────────────
  - job_name: docker-server-a
    static_configs:
      - targets: ["10.0.0.1:9323"]
        labels: { server: a }

  - job_name: docker-server-b
    static_configs:
      - targets: ["localhost:9323"]
        labels: { server: b }

  - job_name: docker-server-c
    static_configs:
      - targets: ["10.0.0.3:9323"]
        labels: { server: c }

  # ── PostgreSQL (Server C) ──────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: ["10.0.0.3:9187"]
        labels: { server: c }

  # ── Redis (Server C) ──────────────────────────────────────
  - job_name: redis
    static_configs:
      - targets: ["10.0.0.3:9121"]
        labels: { server: c }

  # ── Spring Boot Actuator endpoints ─────────────────────────
  - job_name: spring-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["10.0.0.1:8080"]
        labels: { service: gateway }

  - job_name: spring-auth
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["10.0.0.1:8081"]
        labels: { service: auth }

  - job_name: spring-transactional
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "10.0.0.3:8083"  # product
          - "10.0.0.3:8084"  # inventory
          - "10.0.0.3:8085"  # sales
          - "10.0.0.3:8086"  # payment
        labels: { group: transactional }

  # ── LSA Agent health probes ─────────────────────────────────
  - job_name: lsa-agent
    metrics_path: /health
    static_configs:
      - targets:
          - "10.0.0.1:9101"  # Server A
          - "10.0.0.2:9101"  # Server B
          - "10.0.0.3:9101"  # Server C
        labels: { component: lsa-agent }

  # ── NGINX ──────────────────────────────────────────────────
  - job_name: nginx
    static_configs:
      - targets: ["10.0.0.1:9113"]
        labels: { server: a }
