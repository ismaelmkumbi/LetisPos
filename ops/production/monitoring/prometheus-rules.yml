# LetisPOS — Prometheus alerting rules

groups:
  - name: server-health
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} has been unreachable for 2 minutes."

      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage above 85% on {{ $labels.instance }}"
          description: "Memory: {{ $value | humanize }}% used."

      - alert: HighDiskUsage
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage above 85% on {{ $labels.instance }}"

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage above 80% on {{ $labels.instance }}"

  - name: application-health
    rules:
      - alert: ServiceDown
        expr: up{job=~"spring-.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service }} is down"
          description: "{{ $labels.service }} health check failing."

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"

      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "5xx error rate above 5% on {{ $labels.service }}"

  - name: database-health
    rules:
      - alert: PostgresSlowQueries
        expr: rate(pg_stat_activity_max_tx_duration_seconds[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow PostgreSQL queries detected"

      - alert: PostgresConnectionsHigh
        expr: pg_stat_database_numbackends / pg_settings_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections above 80%"

  - name: kafka-health
    rules:
      - alert: DltBacklog
        expr: kafka_consumergroup_lag{group=~".*-dlt"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DLT backlog for {{ $labels.group }}"
          description: "Consumer group {{ $labels.group }} has {{ $value }} unprocessed DLT messages on topic {{ $labels.topic }}."

      - alert: KafkaConsumerLag
        expr: kafka_consumergroup_lag{group!~".*-dlt"} > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag > 1000 for {{ $labels.group }}"
          description: "Consumer group {{ $labels.group }} is {{ $value }} messages behind on topic {{ $labels.topic }}."
