networks:
  server-b-net:
    driver: bridge
services:
  ai-service:
    container_name: letispos-ai
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 384M
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AUTH_JWKS_URI: https://letispos.com/.well-known/jwks.json
      AUTH_SERVICE_URL: http://10.0.0.1:8081
      CUSTOMER_SERVICE_URL: http://10.0.0.3:8085
      DB_PASSWORD: ai_pass
      DB_URL: jdbc:postgresql://10.0.0.3:5432/ai_db
      DB_USERNAME: ai_user
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DOCUMENT_SERVICE_URL: http://document-service:8093
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      INVENTORY_SERVICE_URL: http://10.0.0.3:8084
      JAVA_TOOL_OPTIONS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0
        -Dnetworkaddress.cache.ttl=5 -Dnetworkaddress.cache.negative.ttl=5 -XX:+UseZGC
        -XX:ZCollectionInterval=10 -XX:SoftMaxHeapSize=512M -XX:ZUncommitDelay=300
        -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp
      KAFKA_BOOTSTRAP: 10.0.0.3:9094
      KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
      MINIO_ACCESS_KEY: smartpos
      MINIO_ENDPOINT: http://10.0.0.1:9000
      MINIO_SECRET_KEY: smartpos-secret
      NOTIFICATION_SERVICE_URL: http://notification-service:8089
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PAYMENT_SERVICE_URL: http://10.0.0.3:8086
      PLATFORM_AI_PROVIDER: openai
      PRODUCT_SERVICE_URL: http://10.0.0.3:8083
      REDIS_HOST: 10.0.0.3
      REDIS_PORT: '6379'
      REPORT_SERVICE_URL: http://report-service:8087
      SALES_SERVICE_URL: http://10.0.0.3:8085
      SERVER_PORT: '8091'
      SMARTPOS_BRAND_IMAGE_GEN_PROVIDER: ${SMARTPOS_BRAND_IMAGE_GEN_PROVIDER:-openai-dalle}
      SPRING_APPLICATION_JSON: '{"minio":{"endpoint":"http://10.0.0.1:9000","access-key":"smartpos","secret-key":"smartpos-secret"}}'
      SPRING_DATA_REDIS_HOST: 10.0.0.3
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 10.0.0.3:9094
      USER_SERVICE_URL: https://letispos.com
    healthcheck:
      interval: 15s
      retries: 15
      start_period: 120s
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8091/actuator/health || exit 1
      timeout: 10s
    image: ghcr.io/ismaelmkumbi/ai-service:latest
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 20m
    networks:
    - server-b-net
    ports:
    - 0.0.0.0:8091:8091
    restart: unless-stopped
