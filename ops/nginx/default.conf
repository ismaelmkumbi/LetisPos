# LetisPOS — Nginx configuration for frontend SPA
#
# Serves the React SPA with client-side routing (all paths fall back to index.html)
# and proxies /api requests to the API Gateway.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Static assets — cache aggressively (hashed filenames from Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to Spring Cloud Gateway
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Strip HTTP/1.1 hop-by-hop headers forbidden in HTTP/2
        proxy_hide_header Connection;
        proxy_hide_header Keep-Alive;
        proxy_hide_header Transfer-Encoding;
        proxy_hide_header Upgrade;
    }

    # SPA fallback — all non-file requests go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
