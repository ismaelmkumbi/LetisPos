# Production JWT configuration for LetisPOS auth-service.
# Install this drop-in to /etc/systemd/system/letispos-auth.service.d/env.conf
# then run: systemctl daemon-reload && systemctl restart letispos-auth

[Service]
Environment="JWT_PRIVATE_KEY_PATH=/etc/letispos/jwt/private.pem"
Environment="JWT_PUBLIC_KEY_PATH=/etc/letispos/jwt/public.pem"
Environment="JWT_ALLOW_EPHEMERAL_KEYS=false"
