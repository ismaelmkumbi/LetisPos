server:
  port: 8092
  error:
    include-message: always

spring:
  application:
    name: integration-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/integration_db}
    username: ${DB_USER:integration_user}
    password: ${DB_PASSWORD:integration_pass}
    hikari:
      maximum-pool-size: 8
      keepalive-time: 30000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:none}
    properties:
      hibernate:
        jdbc.time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      group-id: ${KAFKA_GROUP:smartpos-integration-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer:   org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate

smartpos:
  internal:
    shared-secret: ${SMARTPOS_INTERNAL_SHARED_SECRET:dev-internal-token-change-me}
  integration:
    zatca:
      enabled: ${ZATCA_ENABLED:false}
      vat-number: ${ZATCA_VAT_NUMBER:}
      seller-name: ${ZATCA_SELLER_NAME:}
    woocommerce:
      enabled: ${WOO_ENABLED:false}
      site-url: ${WOO_SITE_URL:}
      consumer-key:    ${WOO_KEY:}
      consumer-secret: ${WOO_SECRET:}
    quickbooks:
      enabled: ${QB_ENABLED:false}
      base-url:    ${QB_BASE_URL:https://quickbooks.api.intuit.com}
      company-id:  ${QB_COMPANY_ID:}
      access-token: ${QB_ACCESS_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

logging:
  level:
    root: INFO
    io.smartpos: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
