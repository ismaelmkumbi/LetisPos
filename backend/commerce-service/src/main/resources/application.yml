server:
  port: 8097

spring:
  application:
    name: commerce-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commerce_db}
    username: ${DB_USERNAME:commerce_user}
    password: ${DB_PASSWORD:commerce_pass}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

smartpos:
  outbox:
    enabled: false
    topic-prefix: smartpos.commerce

commerce:
  product-service:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
  inventory-service:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
  sales-service:
    base-url: ${SALES_SERVICE_URL:http://localhost:8085}
  payment-service:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8086}
  crm-service:
    base-url: ${CRM_SERVICE_URL:http://localhost:8096}
  notification-service:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8089}
  customer:
    jwt-secret: ${CUSTOMER_JWT_SECRET:commerce-customer-jwt-secret-change-me}
  cart:
    cookie-name: commerce_cart_id
    guest-ttl-days: 7
    cookie-signing-key: ${CART_COOKIE_SIGNING_KEY:change-me-in-production}

resilience4j:
  circuitbreaker:
    instances:
      product-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      inventory-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      product-service:
        max-attempts: 3
        wait-duration: 100ms
        exponential-backoff-multiplier: 2
      inventory-service:
        max-attempts: 3
        wait-duration: 100ms
        exponential-backoff-multiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

logging:
  level:
    root: INFO
    io.smartpos.commerce: DEBUG
 
