server:
  port: 8081
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: auth-service

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 10000
            logger-level: basic
          billing-service:
            url: ${BILLING_URI:http://localhost:8094}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USER:auth_user}
    password: ${DB_PASSWORD:auth_pass}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      keepalive-time: 30000

  jpa:
    hibernate:
      # Schema is owned by Flyway. Keep `none` until citext column types
      # on the User entity are explicitly declared (see migration V1).
      ddl-auto: ${SPRING_JPA_DDL_AUTO:none}
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:false}
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: ${AUTH_CLAIMS_CACHE_TTL_MS:60000}
      cache-null-values: false
      key-prefix: "smartpos:auth:"

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      acks: all
      key-serializer:   org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

smartpos:
  outbox:
    enabled: ${SMARTPOS_OUTBOX_ENABLED:true}
    topic-prefix: smartpos.auth
  auth:
    jwt:
      # Dev key. In production mount via Vault/K8s secret and rotate quarterly.
      # Generated with: openssl genpkey -algorithm RSA -pkcs8 -out priv.pem -pkeyopt rsa_keygen_bits:2048
      issuer: smartpos-auth
      # Override per env: SMARTPOS_AUTH_JWT_ACCESS_TOKEN_TTL_MINUTES=15 in prod.
      access-token-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:60}
      refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:7}
      # Path to PEM keys. If blank, a keypair is generated on startup (DEV ONLY).
      private-key-path: ${JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:}
      allow-ephemeral-keys: ${JWT_ALLOW_EPHEMERAL_KEYS:false}
      key-id: smartpos-auth-key-1
      refresh-cookie-name: ${REFRESH_COOKIE_NAME:smartpos_refresh}
      refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    bootstrap:
      # Creates an initial admin user on first startup if no users exist.
      admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@smartpos.local}
      admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}
  verification:
    resend:
      api-key: ${RESEND_API_KEY:}
      from-address: ${RESEND_FROM_ADDRESS:noreply@send.letispos.com}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      phone-number: ${TWILIO_PHONE_NUMBER:}
    app-base-url: ${APP_BASE_URL:http://localhost:5173}
    email-logo-url: ${EMAIL_LOGO_URL:https://letispos.com/email-logo.png}
  internal:
    # Shared secret used when calling other services' /api/internal/** endpoints
    # (e.g. user-service for JWT claim hydration at login). Must match value on the server.
    shared-secret: ${SMARTPOS_INTERNAL_SHARED_SECRET:dev-internal-token-change-me}
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:8082}
  audit-service:
    base-url: ${AUDIT_SERVICE_URL:http://localhost:8095}

logging:
  level:
    root: WARN
    io.smartpos: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
