<!-- Welcome Email Template -->
<!-- Variables: {{heading}}, {{subheading}}, {{first_name}}, {{workspace_name}}, {{plan_name}}, {{login_url}}, {{footer_text}}, {{legal}} -->

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="padding:0;">
      <p style="margin:0 0 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;color:#334155;line-height:1.6;">
        Hi {{first_name}},
      </p>
      <p style="margin:0 0 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;color:#334155;line-height:1.6;">
        Your account is verified &mdash; welcome to Letis POS. Your workspace <strong style="color:#0F172A;">{{workspace_name}}</strong> is ready on the <span style="color:#16A34A;font-weight:600;">{{plan_name}}</span> plan.
      </p>

      <!-- Feature cards -->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 4px;">
        <tr>
          {{feature_cards}}
        </tr>
      </table>

      <p style="margin:20px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;color:#334155;line-height:1.6;">
        Get started by logging in and setting up your first products, categories, and sales terminal.
      </p>
    </td>
  </tr>
</table>

{{cta_block}}
