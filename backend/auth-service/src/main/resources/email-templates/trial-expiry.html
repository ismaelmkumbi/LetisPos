<!-- Trial Expiry Email Body -->
<!-- Variables: {{badge_text}}, {{workspace_name}}, {{trial_status}}, {{action_text}}, {{upgrade_url}} -->

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="padding:0;">
      <!-- Status badge -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px;">
        <tr>
          <td style="background-color:#FEF3C7;border-radius:20px;padding:6px 16px;">
            <span style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;color:#92400E;">{{badge_text}}</span>
          </td>
        </tr>
      </table>

      <p style="margin:0 0 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;color:#334155;line-height:1.65;">
        Your trial for <strong style="color:#0F172A;">{{workspace_name}}</strong> {{trial_status}}.
      </p>
      <p style="margin:0 0 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;color:#334155;line-height:1.65;">
        {{action_text}} Upgrade to keep all your data, settings, and access to premium features.
      </p>
    </td>
  </tr>
</table>

{{cta_block}}
