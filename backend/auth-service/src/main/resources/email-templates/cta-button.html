<!-- CTA Button Partial -->
<!-- Variables: {{cta_text}}, {{cta_url}} -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="padding:24px 40px 4px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
        <tr>
          <td style="background:linear-gradient(135deg, #16A34A 0%, #15803D 100%);border-radius:8px;text-align:center;">
            <a href="{{cta_url}}" target="_blank" style="display:inline-block;padding:14px 36px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;color:#FFFFFF;text-decoration:none;letter-spacing:0.1px;white-space:nowrap;">{{cta_text}}</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
