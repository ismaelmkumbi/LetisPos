<!-- Verification Email Body -->
<!-- Variables: {{verify_url}}, {{expiry_hours}} -->

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="padding:0;">
      <p style="margin:0 0 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;color:#334155;line-height:1.65;">
        Thanks for creating your Letis POS workspace. Click the button below to verify your email and activate your account.
      </p>
    </td>
  </tr>
</table>

{{cta_block}}

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="padding:0;">
      <p style="margin:28px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#94A3B8;line-height:1.5;text-transform:uppercase;letter-spacing:0.3px;">
        Or copy this link
      </p>
      <p style="margin:6px 0 0;font-family:Menlo,Monaco,'Courier New',monospace;font-size:12px;color:#64748B;line-height:1.5;word-break:break-all;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:10px 14px;">
        {{verify_url}}
      </p>
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:16px 0 0;">
        <tr>
          <td style="width:16px;vertical-align:top;padding-top:1px;">
            <span style="display:inline-block;width:16px;height:16px;background-color:#E2E8F0;border-radius:50%;text-align:center;line-height:16px;font-size:10px;color:#64748B;">&excl;</span>
          </td>
          <td style="padding-left:8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#94A3B8;line-height:1.5;">
            This link expires in {{expiry_hours}} hours. If you didn't create this account, you can safely ignore this email.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
