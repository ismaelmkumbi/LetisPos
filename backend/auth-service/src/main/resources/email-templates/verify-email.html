<!-- Verification Email Template -->
<!-- Variables: {{heading}}, {{subheading}}, {{verify_url}}, {{expiry_hours}}, {{footer_text}}, {{legal}} -->

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="padding:0;">
      <p style="margin:0 0 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;color:#334155;line-height:1.6;">
        Click the button below to verify your account and activate your Letis POS workspace.
      </p>
    </td>
  </tr>
</table>

{{cta_block}}

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="padding:0;">
      <p style="margin:24px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;color:#94A3B8;line-height:1.6;">
        Or copy this link into your browser:
      </p>
      <p style="margin:4px 0 12px;font-family:monospace;font-size:12px;color:#64748B;line-height:1.5;word-break:break-all;">
        {{verify_url}}
      </p>
      <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#CBD5E1;line-height:1.5;">
        This link expires in {{expiry_hours}} hours. If you didn't create this account, you can safely ignore this email.
      </p>
    </td>
  </tr>
</table>
