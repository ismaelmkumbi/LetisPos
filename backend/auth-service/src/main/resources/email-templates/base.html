<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="x-apple-disable-message-reformatting">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Letis POS</title>
</head>
<body style="margin:0;padding:0;background-color:#F8FAFC;-webkit-text-size-adjust:none;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F8FAFC;">
<tr>
<td align="center" style="padding:56px 24px;">

<!-- Card -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
<tr>
<td style="background-color:#FFFFFF;border-radius:16px;padding:48px 48px 40px;">

<!-- Logo row -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0">
<tr>
<td style="width:40px;height:40px;background-color:#16A34A;border-radius:9px;text-align:center;vertical-align:middle;">
<span style="font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:700;color:#FFFFFF;line-height:40px;">L</span>
</td>
<td style="width:14px;"></td>
<td style="font-family:Georgia,'Times New Roman',serif;font-size:17px;font-weight:700;color:#0F172A;letter-spacing:0.3px;">LETIS POS</td>
</tr>
</table>

<!-- Spacer -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td style="height:36px;"></td></tr></table>

<!-- Heading -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td style="font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:400;color:#0F172A;line-height:1.2;letter-spacing:-0.3px;">
{{heading}}
</td>
</tr>
<tr>
<td style="padding-top:10px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;color:#64748B;line-height:1.5;">
{{subheading}}
</td>
</tr>
</table>

<!-- Spacer -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td style="height:28px;"></td></tr></table>

<!-- Thin rule -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr><td style="border-top:1px solid #E2E8F0;font-size:0;">&nbsp;</td></tr>
</table>

<!-- Spacer -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td style="height:24px;"></td></tr></table>

<!-- Body -->
{{body}}

<!-- CTA -->
{{cta_block}}

</td>
</tr>
</table>

<!-- Footer -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
<tr>
<td style="padding:28px 24px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#94A3B8;line-height:1.6;text-align:center;">
{{footer_text}}
<br>{{legal}}
</td>
</tr>
</table>

</td>
</tr>
</table>
</body>
</html>
