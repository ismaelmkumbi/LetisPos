<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Letis POS</title>
</head>
<body style="margin:0;padding:0;background-color:#F1F5F9;-webkit-text-size-adjust:none;-ms-text-size-adjust:none;">
<!--[if mso]><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td align="center"><![endif]-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F1F5F9;">
  <tr>
    <td align="center" style="padding:48px 20px;">

      <!-- Container -->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:580px;margin:0 auto;">
        <tr>
          <td style="background-color:#FFFFFF;border-radius:14px;overflow:hidden;box-shadow:0 4px 24px rgba(15,23,42,0.04),0 1px 4px rgba(15,23,42,0.03);">

            <!-- Header with logo -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding:40px 44px 36px;text-align:center;">
                  <!-- Logo icon: hosted SVG for Gmail/Apple Mail, VML for Outlook -->
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
                    <tr>
                      <td style="width:44px;height:44px;vertical-align:middle;">
                        <!--[if mso]>
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td style="width:44px;height:44px;background-color:#16A34A;border-radius:10px;text-align:center;vertical-align:middle;"><span style="font-family:Georgia,serif;font-size:22px;font-weight:700;color:#FFFFFF;line-height:44px;">L</span></td></tr></table>
                        <![endif]-->
                        <!--[if !mso]><!-->
                        <img src="https://letispos.com/logoIcon.svg" width="44" height="44" alt="Letis POS" style="display:block;border:0;outline:none;">
                        <!--<![endif]-->
                      </td>
                      <td style="padding-left:12px;vertical-align:middle;">
                        <span style="font-family:Georgia,'Times New Roman',serif;font-size:19px;font-weight:700;color:#0F172A;letter-spacing:-0.2px;">LETIS POS</span>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

            <!-- Green accent rule -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding:0 44px 0;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td style="height:3px;background:linear-gradient(to right,#16A34A,#22C55E,#4ADE80);font-size:0;line-height:0;border-radius:2px;">&nbsp;</td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

            <!-- Title -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding:28px 44px 0;">
                  <h1 style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:700;color:#0F172A;line-height:1.25;letter-spacing:-0.4px;">
                    {{heading}}
                  </h1>
                  <p style="margin:8px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;color:#64748B;line-height:1.5;">
                    {{subheading}}
                  </p>
                </td>
              </tr>
            </table>

            <!-- Body -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding:8px 44px 0;">
                  {{body}}
                </td>
              </tr>
            </table>

            <!-- CTA -->
            {{cta_block}}

            <!-- Divider -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding:32px 44px 0;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td style="border-top:1px solid #E2E8F0;font-size:0;line-height:0;">&nbsp;</td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

            <!-- Footer -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding:20px 44px 32px;">
                  <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;color:#475569;line-height:1.6;">
                    <strong style="color:#0F172A;">Letis POS</strong> &mdash; Smart point of sale for modern businesses
                  </p>
                  <p style="margin:4px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#94A3B8;line-height:1.5;">
                    {{footer_text}}
                  </p>
                </td>
              </tr>
            </table>

          </td>
        </tr>
      </table>

      <!-- Address & legal -->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:580px;margin:0 auto;">
        <tr>
          <td style="padding:24px 20px 0;text-align:center;">
            <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;color:#94A3B8;line-height:1.6;">
              {{legal}}
            </p>
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</body>
</html>
