server:
  port: 8094

spring:
  application:
    name: billing-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/billing_db}
    username: ${DB_USERNAME:smartpos}
    password: ${DB_PASSWORD:smartpos}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

smartpos:
  internal:
    shared-secret: ${INTERNAL_SHARED_SECRET:dev-internal-token-change-me}
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  billing:
    stripe:
      enabled: ${STRIPE_ENABLED:true}
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      price-starter-monthly: ${STRIPE_PRICE_STARTER_MONTHLY:}
      price-starter-annual: ${STRIPE_PRICE_STARTER_ANNUAL:}
      price-business-monthly: ${STRIPE_PRICE_BUSINESS_MONTHLY:}
      price-business-annual: ${STRIPE_PRICE_BUSINESS_ANNUAL:}
      price-professional-monthly: ${STRIPE_PRICE_PROFESSIONAL_MONTHLY:}
      price-professional-annual: ${STRIPE_PRICE_PROFESSIONAL_ANNUAL:}
      price-enterprise-monthly: ${STRIPE_PRICE_ENTERPRISE_MONTHLY:}
    daraja:
      enabled: ${DARAJA_ENABLED:false}
      consumer-key: ${DARAJA_CONSUMER_KEY:}
      consumer-secret: ${DARAJA_CONSUMER_SECRET:}
      passkey: ${DARAJA_PASSKEY:}
      shortcode: ${DARAJA_SHORTCODE:174379}
      environment: ${DARAJA_ENVIRONMENT:sandbox}
      # sandbox URLs
      auth-url: https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials
      stk-push-url: https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest
      query-url: https://sandbox.safaricom.co.ke/mpesa/stkpushquery/v1/query

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
