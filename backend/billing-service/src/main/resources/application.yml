server:
  port: 8094

spring:
  application:
    name: billing-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/billing_db}
    username: ${DB_USERNAME:smartpos}
    password: ${DB_PASSWORD:smartpos}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:false}
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 10000
            logger-level: basic
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

smartpos:
  internal:
    shared-secret: ${INTERNAL_SHARED_SECRET:dev-internal-token-change-me}
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  billing:
    stripe:
      enabled: ${platform.payment.stripe.enabled:false}
      secret-key: ${platform.payment.stripe.secret_key:}
      webhook-secret: ${platform.payment.stripe.webhook_secret:}
      price-starter-monthly: ${platform.payment.stripe.price_starter_monthly:}
      price-starter-annual: ${STRIPE_PRICE_STARTER_ANNUAL:}
      price-business-monthly: ${platform.payment.stripe.price_business_monthly:}
      price-business-annual: ${STRIPE_PRICE_BUSINESS_ANNUAL:}
      price-professional-monthly: ${platform.payment.stripe.price_professional_monthly:}
      price-professional-annual: ${STRIPE_PRICE_PROFESSIONAL_ANNUAL:}
      price-enterprise-monthly: ${STRIPE_PRICE_ENTERPRISE_MONTHLY:}
    daraja:
      enabled: ${platform.payment.mpesa.enabled:false}
      consumer-key: ${platform.payment.mpesa.consumer_key:}
      consumer-secret: ${platform.payment.mpesa.consumer_secret:}
      passkey: ${platform.payment.mpesa.passkey:}
      shortcode: ${platform.payment.mpesa.shortcode:174379}
      environment: ${DARAJA_ENVIRONMENT:sandbox}
      # sandbox URLs
      auth-url: https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials
      stk-push-url: https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest
      query-url: https://sandbox.safaricom.co.ke/mpesa/stkpushquery/v1/query

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
