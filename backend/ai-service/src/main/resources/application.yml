server:
  port: 8091
  error:
    include-message: always

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:smartpos}
  secret-key: ${MINIO_SECRET_KEY:smartpos-secret}

spring:
  application:
    name: ai-service

  mvc:
    async:
      request-timeout: 120000

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_db}
    username: ${DB_USER:ai_user}
    password: ${DB_PASSWORD:ai_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      keepalive-time: 30000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:none}
    properties:
      hibernate:
        jdbc.time_zone: UTC
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 15000
            logger-level: basic

smartpos:
  internal:
    shared-secret: ${SMARTPOS_INTERNAL_SHARED_SECRET:dev-internal-token-change-me}
  ai:
    sales-service-url: ${SALES_SERVICE_URL:http://localhost:8085}
    inventory-service-url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
    product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
    payment-service-url: ${PAYMENT_SERVICE_URL:http://localhost:8086}
    customer-service-url: ${CUSTOMER_SERVICE_URL:http://localhost:8085}
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8089}
    document-service-url: ${DOCUMENT_SERVICE_URL:http://localhost:8093}
    report-service-url: ${REPORT_SERVICE_URL:http://report-service:8087}
    # Active provider — one of: anthropic | openai | deepseek | stub
    # All keys come exclusively from Platform Settings (admin panel).
    # No env-var fallback — the admin panel is the single source of truth.
    provider: ${platform.ai.provider:stub}
    anthropic:
      api-key: ${platform.ai.anthropic.api_key:}
      model:   ${platform.ai.anthropic.model:claude-sonnet-4-6}
      max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}
    openai:
      api-key:  ${platform.ai.openai.api_key:}
      model:    ${platform.ai.openai.model:gpt-4o-mini}
      base-url: ${platform.ai.openai.base_url:https://api.openai.com/v1}
    deepseek:
      api-key:  ${platform.ai.deepseek.api_key:}
      model:    ${platform.ai.deepseek.model:deepseek-chat}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

logging:
  level:
    root: INFO
    io.smartpos: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"


