server:
  port: 8091
  error:
    include-message: always

spring:
  application:
    name: ai-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_db}?preferQueryMode=${DB_PREFER_QUERY_MODE:simple}
    username: ${DB_USER:ai_user}
    password: ${DB_PASSWORD:ai_pass}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:none}
    properties:
      hibernate:
        jdbc.time_zone: UTC
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

smartpos:
  internal:
    shared-secret: ${SMARTPOS_INTERNAL_SHARED_SECRET:dev-internal-token-change-me}
  ai:
    sales-service-url: ${SALES_SERVICE_URL:http://localhost:8085}
    inventory-service-url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
    product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
    payment-service-url: ${PAYMENT_SERVICE_URL:http://localhost:8086}
    customer-service-url: ${CUSTOMER_SERVICE_URL:http://localhost:8085}
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8089}
    document-service-url: ${DOCUMENT_SERVICE_URL:http://localhost:8093}
    # Active provider — one of: anthropic | openai | deepseek | stub
    provider: ${AI_PROVIDER:stub}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model:   ${ANTHROPIC_MODEL:claude-sonnet-4-6}
      max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}
    openai:
      api-key:  ${OPENAI_API_KEY:}
      model:    ${OPENAI_MODEL:gpt-4o-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    deepseek:
      api-key:  ${DEEPSEEK_API_KEY:}
      model:    ${DEEPSEEK_MODEL:deepseek-chat}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

logging:
  level:
    root: INFO
    io.smartpos: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
