server:
  port: 8080

spring:
  application:
    name: gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      routes:
        # ---- Auth Service (public: login, refresh, register, jwks) ----
        - id: auth-public
          uri: ${AUTH_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/login,/api/v1/auth/refresh,/api/v1/auth/logout,/api/v1/auth/register,/api/v1/auth/password/**,/api/v1/auth/verify,/api/v1/auth/resend-verification,/.well-known/jwks.json
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@clientIpKeyResolver}"

        - id: auth-protected
          uri: ${AUTH_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/me,/api/v1/tenants/**

        # ---- User Service ----
        - id: user-service
          uri: ${USER_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**,/api/v1/roles/**,/api/v1/permissions,/api/v1/support/**,/api/v1/menu/**,/api/v1/admin/menu/**,/api/v1/admin/features/**

        # ---- User Service: i18n admin lives here ----
        - id: user-service-i18n
          uri: ${USER_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/i18n/**

        # ---- Product Service (catalog + IMEI/serials) ----
        - id: product-service
          uri: ${PRODUCT_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/brands/**,/api/v1/units/**,/api/v1/barcodes/**,/api/v1/customers/**,/api/v1/suppliers/**,/api/v1/serials/**,/api/v1/price-lists/**,/api/v1/customer-groups/**,/api/v1/gift-cards/**,/api/v1/store-credit/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                key-resolver: "#{@clientIpKeyResolver}"

        # ---- Inventory Service ----
        - id: inventory-service
          uri: ${INVENTORY_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/warehouses/**,/api/v1/stock/**,/api/v1/transfers/**,/api/v1/adjustments/**,/api/v1/stock-counts/**,/api/v1/batches/**,/api/v1/reorder-rules/**,/api/v1/goods-receipts/**,/api/v1/supplier-returns/**,/api/v1/inventory/**

        # ---- Sales / POS Service (incl. recurring invoices, terminals, offline sync, returns) ----
        - id: sales-service
          uri: ${SALES_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/sales/**,/api/v1/pos/**,/api/v1/pos-settings/**,/api/v1/quotations/**,/api/v1/purchases/**,/api/v1/purchase-returns/**,/api/v1/returns/**,/api/v1/recurring-invoices/**,/api/v1/pos-terminals/**,/api/v1/offline/**,/api/v1/cash-registers/**,/api/v1/suspended-sales/**,/api/v1/promotions/**,/api/v1/brand/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                key-resolver: "#{@clientIpKeyResolver}"

        # ---- Payment Service (Stripe webhook first — must match before the authed route) ----
        - id: payment-service-webhook
          uri: ${PAYMENT_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/payments/stripe/webhook
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@clientIpKeyResolver}"

        - id: payment-service
          uri: ${PAYMENT_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/payments/**,/api/v1/accounts/**,/api/v1/expenses/**,/api/v1/deposits/**,/api/v1/chart-of-accounts/**,/api/v1/journal-entries/**,/api/v1/financials/**,/api/v1/taxes/**

        # ---- Report Service ----
        - id: report-service
          uri: ${REPORT_URI:http://localhost:8087}
          predicates:
            - Path=/api/v1/reports/**,/api/v1/dashboard/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@clientIpKeyResolver}"

        # ---- Notification Service (8089) ----
        - id: notification-service
          uri: ${NOTIFICATION_URI:http://localhost:8089}
          predicates:
            - Path=/api/v1/notifications/**,/api/v1/notification-templates/**

        # ---- HRM Service (8090) ----
        - id: hrm-service
          uri: ${HRM_URI:http://localhost:8090}
          predicates:
            - Path=/api/v1/hrm/**,/api/v1/employees/**,/api/v1/attendance/**,/api/v1/leave-requests/**,/api/v1/payroll/**

        # ---- AI Service (8091) ----
        - id: ai-service
          uri: ${AI_URI:http://localhost:8091}
          predicates:
            - Path=/api/v1/ai/**

        # ---- Integration Service (8092) — webhooks are unauthenticated ----
        - id: integration-service-webhooks
          uri: ${INTEGRATION_URI:http://localhost:8092}
          predicates:
            - Path=/webhooks/**

        - id: integration-service
          uri: ${INTEGRATION_URI:http://localhost:8092}
          predicates:
            - Path=/api/v1/integrations/**

        - id: document-service
          uri: ${DOCUMENT_URI:http://localhost:8093}
          predicates:
            - Path=/api/v1/documents/**,/api/v1/templates/**,/api/v1/print/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@clientIpKeyResolver}"

        # ── Billing service ─────────────────────────────────────────────
        - id: billing-service-public
          uri: ${BILLING_URI:http://localhost:8094}
          predicates:
            - Path=/api/v1/billing/plans
          filters:
            - name: Retry
              args: { retries: 2 }

        - id: billing-service
          uri: ${BILLING_URI:http://localhost:8094}
          predicates:
            - Path=/api/v1/billing/**
          filters:
            - name: Retry
              args: { retries: 2 }

        # ── Audit service ─────────────────────────────────────────────
        - id: audit-service-internal
          uri: ${AUDIT_URI:http://localhost:8095}
          predicates:
            - Path=/api/v1/audit/**
          filters:
            - name: Retry
              args: { retries: 2 }

        - id: audit-service-admin
          uri: ${AUDIT_URI:http://localhost:8095}
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - name: Retry
              args: { retries: 2 }

        # ── CRM service ─────────────────────────────────────────────
        - id: crm-service
          uri: ${CRM_URI:http://localhost:8096}
          predicates:
            - Path=/api/v1/crm/**
          filters:
            - name: Retry
              args: { retries: 2 }

        # ── Branch routes (inventory-service) ───────────────────────────
        - id: inventory-service-branches
          uri: ${INVENTORY_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/branches/**
          filters:
            - name: Retry
              args: { retries: 2 }

        # ── Commerce Service: public storefront ──────────────────────
        - id: commerce-service-public
          uri: ${COMMERCE_URI:http://localhost:8097}
          predicates:
            - Path=/api/v1/storefront/**,/api/v1/robots.txt
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                key-resolver: "#{@clientIpKeyResolver}"

        # ── Commerce Service: admin ──────────────────────────────────
        - id: commerce-service-admin
          uri: ${COMMERCE_URI:http://localhost:8097}
          predicates:
            - Path=/api/v1/commerce/**
          filters:
            - name: Retry
              args: { retries: 2 }

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, gateway

logging:
  level:
    root: INFO
    io.smartpos: DEBUG
    org.springframework.cloud.gateway: INFO
