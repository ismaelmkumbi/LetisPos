server:
  port: 8083
  error:
    include-message: always

spring:
  application:
    name: product-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${DB_USER:product_user}
    password: ${DB_PASSWORD:product_pass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 30000

  jpa:
    hibernate:
      # Schema is owned by Flyway; entities use citext for emails which would
      # otherwise fail validate. Set to `validate` once the entity column
      # definitions are aligned with the migrations.
      ddl-auto: ${SPRING_JPA_DDL_AUTO:none}
    properties:
      hibernate:
        jdbc.time_zone: UTC
        # Batch-fetch lazy collections in chunks so the secondary `barcodes`
        # collection (which we deliberately don't JOIN FETCH — see
        # ProductRepository for the rationale) loads with one IN query per
        # page rather than N+1.
        default_batch_fetch_size: 50
    # Keep the JPA session open during HTTP response serialization so lazy
    # collections (`barcodes`) materialise without forcing every read path
    # to use a DTO projection. Anti-pattern in prod, pragmatic for dev.
    open-in-view: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 3600000         # 1 h default; per-cache TTL below
      use-key-prefix: true
      key-prefix: "smartpos:product:cache:"

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      acks: all
      key-serializer:   org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

smartpos:
  outbox:
    enabled: ${SMARTPOS_OUTBOX_ENABLED:true}
    topic-prefix: smartpos.product
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:smartpos}
    secret-key: ${MINIO_SECRET_KEY:smartpos-secret}
    bucket: ${MINIO_BUCKET:smartpos-product-images}
    presigned-ttl-seconds: ${MINIO_PRESIGNED_TTL:3600}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:#{null}}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

logging:
  level:
    root: WARN
    io.smartpos: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
