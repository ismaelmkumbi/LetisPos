server:
  port: 8087
  error:
    include-message: always

spring:
  application:
    name: report-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/report_db}?preferQueryMode=${DB_PREFER_QUERY_MODE:simple}
    username: ${DB_USER:report_user}
    password: ${DB_PASSWORD:report_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:none}
    properties:
      hibernate:
        jdbc.time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      key-prefix: "smartpos:report:cache:"
      use-key-prefix: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 10000
            logger-level: basic
          sales-service:
            url: ${SALES_URI:http://localhost:8085}
          inventory-service:
            url: ${INVENTORY_URI:http://localhost:8084}
          payment-service:
            url: ${PAYMENT_URI:http://localhost:8086}
          product-service:
            url: ${PRODUCT_URI:http://localhost:8083}
          document-service:
            url: ${DOCUMENT_URI:http://localhost:8093}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      group-id: ${KAFKA_GROUP:smartpos-report-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer:   org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # Producer is needed only for DLT publishing (Phase 6c poison-message handling).
    producer:
      acks: all
      key-serializer:   org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: manual_immediate

smartpos:
  report:
    default-currency: ${SMARTPOS_DEFAULT_CURRENCY:TZS}
    export:
      sweep-ms: ${SMARTPOS_EXPORT_SWEEP_MS:30000}
    inventory-snapshot:
      cron: ${SMARTPOS_INV_SNAPSHOT_CRON:0 30 1 * * *}   # 01:30 UTC daily
  minio:
    endpoint:   ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:smartpos}
    secret-key: ${MINIO_SECRET_KEY:smartpos-secret}
    bucket:     ${MINIO_BUCKET:smartpos-exports}
    presigned-ttl-seconds: ${MINIO_PRESIGNED_TTL:3600}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

logging:
  level:
    root: INFO
    io.smartpos: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
