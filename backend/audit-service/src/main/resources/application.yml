server:
  port: 8095

spring:
  application:
    name: audit-service
  datasource:
    url: jdbc:postgresql://localhost:5434/audit_db
    username: ${DB_USERNAME:smartpos}
    password: ${DB_PASSWORD:smartpos}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

smartpos:
  internal:
    shared-secret: ${INTERNAL_SHARED_SECRET:dev-internal-token-change-me}
